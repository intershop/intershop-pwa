headers:
  # Permissive-by-default security headers for the standard PWA.
  # script-src blocks inline scripts, inline event handlers and 'javascript:' URLs; only the following inline code is allowed by its hash:
  # - sha256-dW0e...: the cookie banner script in src/index.html (update the hash whenever that script changes)
  # - 'unsafe-hashes' sha256-MhtP...: the onload="this.media='all'" handler generated by the critical CSS inlining of the production build
  #   Only needed for builds without a deploy URL (e.g., 'npm run build'); the standard Docker image is built with
  #   '--deploy-url=DEPLOY_URL_PLACEHOLDER', which skips the critical CSS inlining, so no onload handler is generated.
  #   Kept as a harmless fallback because it allows exactly this handler only.
  # Drop the broad https: source and list the trusted script origins instead (see docs/guides/security-headers.md).
  - Content-Security-Policy: >-
      default-src 'self' https:;
      script-src 'self' https: 'sha256-dW0eELjdgTmSUdeaPS5Zj/GeIqiLQLyr/kqEzI27EjA=' 'unsafe-hashes' 'sha256-MhtPZXr7+LpJUY5qtMutB+qWfQtMaPccfe7QXtCcEYc=';
      style-src 'self' 'unsafe-inline' https:;
      img-src 'self' data: blob: https:;
      font-src 'self' data: https:;
      connect-src 'self' https:;
      frame-src 'self' https:;
      child-src 'self' blob: https:;
      worker-src 'self' blob:;
      form-action 'self' https:;
      base-uri 'self';
      object-src 'none'
  - X-Content-Type-Options: 'nosniff'
  - Referrer-Policy: 'strict-origin-when-cross-origin'
  # allow the store locator (geolocation) but disable clearly unused invasive features
  - Permissions-Policy: 'camera=(), microphone=(), geolocation=(self)'
  # allow-popups keeps popup-based payment/checkout flows working
  - Cross-Origin-Opener-Policy: 'same-origin-allow-popups'
