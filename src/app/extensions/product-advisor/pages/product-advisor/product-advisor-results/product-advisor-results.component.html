<div class="product-advisor-results">
  <div class="advisor-results-header">
    <h2>{{ 'copilot.product_advisor.results.title' | translate }}</h2>
    <p>{{ 'copilot.product_advisor.results.subtitle' | translate }}</p>
  </div>
  @if (products.length) {
    <div class="advisor-results-list">
      @for (product of products; track product.sku) {
        <ish-product-item ishProductContext [sku]="product.sku" />
      }
    </div>
  } @else {
    <p class="advisor-results-intro">{{ 'copilot.product_advisor.results.intro' | translate }}</p>
  }
</div>
