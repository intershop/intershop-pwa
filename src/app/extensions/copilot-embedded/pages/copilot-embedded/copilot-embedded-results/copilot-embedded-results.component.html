<div class="copilot-embedded-results">
  <div class="section">
    <h2>{{ 'copilot.embedded.results.title' | translate }}</h2>
    <p>{{ 'copilot.embedded.results.subtitle' | translate }}</p>
  </div>
  @let products = products$ | async;
  @if (products?.length) {
    <div class="copilot-embedded-results-list">
      @for (product of products; track product.sku) {
        <ish-copilot-embedded-product ishProductContext [sku]="product.sku" />
      }
    </div>
  } @else {
    <p>{{ 'copilot.embedded.results.intro' | translate }}</p>
  }
  <button class="copilot-embedded-back-to-chat btn btn-link d-md-none" type="button" (click)="backToChat.emit()">
    <i class="bi bi-arrow-left"></i>
    {{ 'copilot.embedded.back_to_chat' | translate }}
  </button>
</div>
