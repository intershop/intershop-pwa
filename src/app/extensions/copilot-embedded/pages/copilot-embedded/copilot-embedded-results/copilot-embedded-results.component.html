<div class="copilot-embedded-results">
  <div class="copilot-embedded-results-header">
    <h2>{{ 'copilot.embedded.results.title' | translate }}</h2>
    <p>{{ 'copilot.embedded.results.subtitle' | translate }}</p>
  </div>
  @if (products.length) {
    <div class="copilot-embedded-results-list">
      @for (product of products; track product.sku) {
        <ish-product-item
          displayType="row"
          ishProductContext
          [configuration]="{
            promotions: false,
            quantity: false,
            inventory: false,
            shipment: false,
            variations: false,
            addToWishlist: false,
            addToOrderTemplate: false,
            addToCompare: false,
            addToQuote: false,
            addToNotification: false,
          }"
          [sku]="product.sku"
        />
      }
    </div>
  } @else {
    <p class="copilot-embedded-results-intro">{{ 'copilot.embedded.results.intro' | translate }}</p>
  }
</div>
