<div class="container copilot-embedded">
  @if (deviceType$ | async; as deviceType) {
    @if (deviceType !== 'mobile') {
      <div class="row">
        <div class="col-8 px-0 pe-4">
          <ish-copilot-embedded-chat
            [deviceType]="deviceType"
            [error]="error"
            [loading]="loading"
            [messages]="messages"
            [pendingAnswer]="pendingAnswer"
            [toolErrors]="toolErrors"
            (send)="onSend($event)"
          />
        </div>
        <div class="col-4">
          <ish-copilot-embedded-results [products]="products" />
        </div>
      </div>
    } @else {
      <ish-copilot-embedded-header />
      <nav #nav="ngbNav" class="nav-tabs" ngbNav>
        <li ngbNavItem role="presentation">
          <a ngbNavLink>{{ 'copilot.embedded.tab.chat' | translate }}</a>
          <ng-template ngbNavContent>
            <ish-copilot-embedded-chat
              [deviceType]="deviceType"
              [error]="error"
              [loading]="loading"
              [messages]="messages"
              [pendingAnswer]="pendingAnswer"
              [toolErrors]="toolErrors"
              (send)="onSend($event)"
            />
          </ng-template>
        </li>
        <li ngbNavItem role="presentation">
          <a ngbNavLink>
            {{ 'copilot.embedded.tab.products' | translate }}
            @if (products.length) {
              ({{ products.length }})
            }
          </a>
          <ng-template ngbNavContent>
            <ish-copilot-embedded-results [products]="products" />
          </ng-template>
        </li>
      </nav>
      <div [ngbNavOutlet]="nav"></div>
    }
  }

  <!-- interim placement; final position to be decided -->
  <button class="btn btn-link mt-3" type="button" (click)="resetSession()">
    {{ 'copilot.embedded.reset' | translate }}
  </button>
</div>
