<div [class]="view === 'small' ? 'copilot-embedded-mobile' : 'copilot-embedded-header-link'">
  <a
    routerLink="/copilot"
    [attr.aria-label]="'copilot.embedded.link' | translate"
    [class.sticky-header-icon]="view === 'small'"
  >
    <i class="bi bi-stars header-icon"></i>
    @if (view !== 'small') {
      <span class="d-none d-md-inline">{{ 'copilot.embedded.link' | translate }}</span>
    }
  </a>
</div>
