<div class="product-advisor-chat">
  <div class="advisor-welcome">
    @if (deviceType !== 'mobile') {
      <div class="advisor-icon">
        <i class="bi bi-stars"></i>
      </div>
      <h1>{{ 'copilot.product_advisor.headline' | translate }}</h1>
    }

    <p>{{ 'copilot.product_advisor.intro' | translate }}</p>

    <div class="advisor-prompt-badges row">
      <div class="col-12 col-sm-6">
        <button class="badge" type="button">
          <span>{{ 'copilot.product_advisor.prompt_1' | translate }}</span>
        </button>
      </div>
      <div class="col-12 col-sm-6">
        <button class="badge" type="button">
          <span>{{ 'copilot.product_advisor.prompt_2' | translate }}</span>
        </button>
      </div>
      <div class="col-12 col-sm-6">
        <button class="badge" type="button">
          <span>{{ 'copilot.product_advisor.prompt_3' | translate }}</span>
        </button>
      </div>
      <div class="col-12 col-sm-6">
        <button class="badge" type="button">
          <span>{{ 'copilot.product_advisor.prompt_4' | translate }}</span>
        </button>
      </div>
    </div>
  </div>

  <div class="advisor-input input-group">
    <div class="advisor-input-field">
      <input class="form-control" type="text" [placeholder]="'copilot.product_advisor.input.placeholder' | translate" />
      <button class="btn" type="button" [attr.aria-label]="'copilot.product_advisor.input.camera' | translate">
        <i class="bi bi-camera-fill"></i>
      </button>
    </div>
    <button class="btn" type="button" [attr.aria-label]="'copilot.product_advisor.input.send' | translate">
      <i class="bi bi-send-fill"></i>
    </button>
  </div>
</div>
