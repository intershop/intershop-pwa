<fieldset [class]="props.fieldsetClass">
  <!-- prettier-ignore -->
  @if (props.legend) {
  <legend [class]="props.legendClass ? props.legendClass : 'visually-hidden'">{{ props.legend | translate }}</legend>
  }
  <div [class]="props.childClass">
    @for (f of field.fieldGroup; track f.id) {
      <formly-field [field]="f" />
    }
  </div>
</fieldset>
